<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Wald</title>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#1e293b;padding:28px;border-radius:16px;width:85%;max-width:360px}
h1{color:#a3e635;text-align:center}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border-radius:8px;border:0}
button{background:#a3e635;font-weight:bold;font-size:16px}
p{text-align:center;color:#cbd5e1}
</style>
</head>
<body>
<div class="box">
<h1>Task Wald</h1>
<p>Create your account</p>
<form id="signup">
<input id="name" placeholder="Your name" required>
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password (min 8 characters)" minlength="8" required>
<button type="submit">Sign Up</button>
</form>
<p id="message"></p>
</div>
<script>
document.getElementById('signup').addEventListener('submit',function(e){
e.preventDefault();
document.getElementById('message').textContent='Form ready. Secure account setup is still required.';
});
</script>
</body>
</html>
